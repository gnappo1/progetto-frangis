<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Frangis Party</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index.css">
</head>

<body>

<canvas id="particles"></canvas>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="container">

    <div class="eyebrow">Global Event Countdown</div>

    <h1 class="title">FRANGIS PARTY</h1>

    <div class="subtitle">
        A synchronized global moment across all time zones.
    </div>

    <div class="countdown">

        <div class="unit">
            <div class="drop" id="days"></div>
            <div class="label">Days</div>
        </div>

        <div class="unit">
            <div class="drop" id="hours"></div>
            <div class="label">Hours</div>
        </div>

        <div class="unit">
            <div class="drop" id="minutes"></div>
            <div class="label">Minutes</div>
        </div>

        <div class="unit">
            <div class="drop small" id="seconds"></div>
            <div class="label">Seconds</div>
        </div>

    </div>

</div>

<div id="footer">Automatically localized to your timezone</div>

<script src="index.js"></script>

</body>
</html>
